[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faultdet"
version = "0.1.0"
description = "Reproduction and extension of 'CNN-Based Transformer Model for Fault Detection in Power System Networks'"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
